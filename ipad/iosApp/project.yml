# XcodeGen spec (xcodegen generate): the Xcode project is generated from this, not edited by hand.
name: Layerloom
options:
  bundleIdPrefix: com.goosible
  deploymentTarget:
    iOS: "17.0"
targets:
  Layerloom:
    type: application
    platform: iOS
    sources:
      - path: Layerloom
      # The studio's built files (layerloom repo: npx vite build -> dist/client), copied in by scripts/sync-studio.sh.
      - path: studio
        type: folder
        buildPhase: resources
    info:
      path: Layerloom/Info.plist
      properties:
        # Compose Multiplatform requires it (120 Hz drawing on ProMotion screens) and stops at launch without it.
        CADisableMinimumFrameDurationOnPhone: true
        # The app's Documents folder shows in the Files app (On My iPad > Layerloom): PSDs go in, rigs come out.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.goosible.layerloom.ipad
        PRODUCT_NAME: Layerloom
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: Layerloom
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        OTHER_LDFLAGS: ["-framework", "LayerloomKit"]
        FRAMEWORK_SEARCH_PATHS: ["$(SRCROOT)/../build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"]
    preBuildScripts:
      - name: Build the Kotlin app (LayerloomKit)
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          export JAVA_HOME=/opt/homebrew/opt/openjdk@21
          ../gradlew -p . embedAndSignAppleFrameworkForXcode
