# XcodeGen spec (xcodegen generate): the Xcode project is generated from this, not edited by hand.
name: Layerloom
options:
  bundleIdPrefix: com.goosible
  deploymentTarget:
    iOS: "17.0"
targets:
  Layerloom:
    type: application
    platform: iOS
    sources:
      - path: Layerloom
      # The studio's built files (layerloom repo: npx vite build -> dist/client), copied in by scripts/sync-studio.sh.
      - path: studio
        type: folder
        buildPhase: resources
      # The anime upscaler for Clean up, as Core ML (scripts/convert-upscaler-coreml.py); Xcode compiles it to .mlmodelc.
      - path: models/AnimeUpscaler.mlpackage
      # The smart mask: Apple's Core ML SAM 2.1 Tiny (scripts/fetch-sam.sh downloads it; not in git).
      - path: models/SAM2_1TinyImageEncoderFLOAT16.mlpackage
      - path: models/SAM2_1TinyPromptEncoderFLOAT16.mlpackage
      - path: models/SAM2_1TinyMaskDecoderFLOAT16.mlpackage
    info:
      path: Layerloom/Info.plist
      properties:
        # Compose Multiplatform requires it (120 Hz drawing on ProMotion screens) and stops at launch without it.
        CADisableMinimumFrameDurationOnPhone: true
        # The app's Documents folder shows in the Files app (On My iPad > Layerloom): PSDs go in, rigs come out.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        # Registered in App Store Connect as "Layerloom Studio" (2026-10-16). Was com.goosible.layerloom.ipad before: an app
        # installed under the old ID is a separate app with its own Documents - move projects across in the Files app.
        PRODUCT_BUNDLE_IDENTIFIER: com.goosible.layerloom
        # Signing (deploy-ipad.sh passes it too): the personal team Xcode is signed in with.
        DEVELOPMENT_TEAM: 6Q6Y6U54M6
        CODE_SIGN_STYLE: Automatic
        PRODUCT_NAME: Layerloom
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: Layerloom
        # The app icon (Layerloom/Assets.xcassets; one 1024 px image, iOS makes the rest). TestFlight refuses a build without one.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Only standard HTTPS (the private studio): exempt from export rules, so uploads don't stop to ask.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        OTHER_LDFLAGS: ["-framework", "LayerloomKit"]
        FRAMEWORK_SEARCH_PATHS: ["$(SRCROOT)/../build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"]
    preBuildScripts:
      - name: Build the Kotlin app (LayerloomKit)
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          export JAVA_HOME=/opt/homebrew/opt/openjdk@21
          ../gradlew -p . embedAndSignAppleFrameworkForXcode
